
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>喵～時刻 Meow~ Moment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: #F2F0EB;
      color: #222;
    }
    .breathe-animation {
      animation: breathe 14s ease-in-out infinite;
    }
    @keyframes breathe {
      0%   { transform: scale(0.85); }
      28.57% { transform: scale(1); }   /* inhale */
      57.14% { transform: scale(1); }   /* hold */
      100% { transform: scale(0.85); }   /* exhale */
    }
    .stamp-pop {
      animation: stamp-pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes stamp-pop {
      0% { transform: scale(1.8) rotate(-12deg); opacity: 0; }
      70% { transform: scale(0.95) rotate(-12deg); opacity: 1; }
      100% { transform: scale(1) rotate(-12deg); opacity: 1; }
    }
    .grid-dot {
      background-image: radial-gradient(circle at 1px 1px, rgba(120,113,108,0.12) 1px, transparent 0);
      background-size: 10px 10px;
    }
  </style>
