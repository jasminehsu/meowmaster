<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>喵～時刻 Meow~ Moment</title>
  <meta name="description" content="每天一則貓語翻譯，讀懂貓咪的真心話，收集 20 隻貓。" />
  <meta name="theme-color" content="#F2F0EB" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#F2F0EB; --ink:#222; --muted:#8a8a8a; --line:#e7e2d8; --card:#ffffff; --paper:#FFFDF7; --accent:#C9895B; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:"Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap{ max-width:620px; margin:0 auto; padding:0 16px 48px; }

    /* Header */
    .header{ position:sticky; top:0; z-index:50; backdrop-filter:blur(12px); background:rgba(242,240,235,.85); border-bottom:1px solid rgba(120,113,108,.12); }
    .header-inner{ max-width:620px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .brand{ display:flex; align-items:center; gap:10px; }
    .brand svg{ width:28px; height:28px; color:#444; }
    .brand .title{ font-size:13px; letter-spacing:.2em; font-weight:700; }
    .brand .sub{ font-size:10px; color:#8a8a8a; letter-spacing:.12em; margin-top:2px; }
    .h-actions{ display:flex; align-items:center; gap:8px; }
    .badge{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,.7); border:1px solid rgba(120,113,108,.18); font-size:13px; color:#555; }
    .badge svg{ width:20px; height:20px; }
    .badge b{ color:#333; }
    .acct{ font-size:12px; padding:8px 12px; border-radius:999px; border:1px solid rgba(120,113,108,.22); background:#fff; cursor:pointer; color:#333; font-family:inherit; }
    .acct.done{ background:transparent; color:#7a7a7a; cursor:default; }

    /* Tabs */
    .tabs{ display:flex; gap:6px; margin:14px 0 0; background:rgba(255,255,255,.55); padding:5px; border-radius:999px; border:1px solid rgba(120,113,108,.12); }
    .tab{ flex:1; text-align:center; padding:9px 0; border-radius:999px; font-size:14px; cursor:pointer; color:#666; user-select:none; }
    .tab.on{ background:#fff; color:#222; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.06); }

    /* Card */
    .card{ background:var(--card); border-radius:28px; padding:24px; box-shadow:0 14px 34px rgba(0,0,0,.08); margin-top:16px; }
    .eyebrow{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#8a8a8a; letter-spacing:.12em; }
    .catpic{ display:block; width:min(260px,70vw); height:auto; margin:6px auto 0; }
    .catpic.locked{ filter:grayscale(.15); }
    .behavior{ text-align:center; margin:6px 0 0; font-size:14px; color:var(--accent); font-weight:700; letter-spacing:.12em; }
    .bubble{ position:relative; margin:12px auto 0; background:var(--paper); border:1px solid #ece3cf; border-radius:22px; padding:16px 20px; font-size:21px; line-height:1.6; text-align:center; font-weight:500; }
    .bubble::before{ content:""; position:absolute; top:-9px; left:50%; width:16px; height:16px; background:var(--paper); border-left:1px solid #ece3cf; border-top:1px solid #ece3cf; transform:translateX(-50%) rotate(45deg); }
    .truth-label{ margin-top:20px; font-size:12px; color:#8a8a8a; letter-spacing:.16em; }
    .truth{ margin-top:6px; font-size:15px; line-height:1.85; color:#444; }
    .source{ margin-top:10px; font-size:12px; color:#8a8a8a; line-height:1.6; }
    .source a{ color:#8a6a50; }
    .actions{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
    button{ font-family:inherit; border:none; border-radius:999px; padding:11px 18px; cursor:pointer; background:#222; color:#fff; font-size:14px; display:inline-flex; align-items:center; gap:8px; }
    button.secondary{ background:#efede8; color:#222; }
    button.adopt{ background:var(--accent); color:#fff; }
    button svg{ width:18px; height:18px; }
    button:disabled{ opacity:.45; cursor:default; }
    .adopt-row{ margin-top:16px; text-align:center; font-size:13px; color:#8a6a50; }
    .reward{ margin-top:12px; text-align:center; font-size:13px; color:#8a6a50; min-height:20px; }

    /* Dex */
    .dex-head{ display:flex; justify-content:space-between; align-items:baseline; }
    .dex-head h2{ margin:0; font-size:18px; letter-spacing:.08em; }
    .dex-head span{ font-size:13px; color:#8a8a8a; }
    .progress{ height:8px; background:#efe9de; border-radius:999px; margin-top:10px; overflow:hidden; }
    .progress > i{ display:block; height:100%; background:var(--accent); border-radius:999px; }
    .rules{ margin-top:12px; font-size:12px; color:#8a8a8a; line-height:1.7; }
    .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
    .cell{ background:#faf8f4; border:1px solid var(--line); border-radius:18px; padding:8px 6px 10px; text-align:center; cursor:pointer; }
    .cell img{ width:100%; aspect-ratio:1/1; object-fit:contain; display:block; }
    .cell.locked img{ filter:brightness(0) opacity(.12); }
    .cell .n{ font-size:11px; color:#8a8a8a; }
    .cell .t{ font-size:12px; color:#444; margin-top:2px; line-height:1.4; min-height:34px; }
    .cell.locked .t{ color:#aaa; }

    /* Favs */
    .fav{ display:flex; gap:12px; align-items:center; background:#faf8f4; border:1px solid var(--line); border-radius:16px; padding:10px; margin-top:10px; cursor:pointer; }
    .fav img{ width:64px; height:64px; object-fit:contain; }
    .fav .b{ font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.08em; }
    .fav .s{ margin-top:4px; font-size:14px; line-height:1.5; }

    /* Yard */
    .yard{ position:relative; width:100%; aspect-ratio:1136/1408; border-radius:24px; overflow:hidden; background:#efe7da url(./yard/yard.webp) center/cover no-repeat; margin-top:16px; box-shadow:0 14px 34px rgba(0,0,0,.08); }
    .yard img{ position:absolute; display:block; height:auto; }
    .yard .item{ pointer-events:none; filter:drop-shadow(0 6px 8px rgba(0,0,0,.08)); }
    .yard .bowl{ left:50%; bottom:6%; width:24%; transform:translateX(-50%); cursor:pointer; filter:drop-shadow(0 6px 8px rgba(0,0,0,.10)); }
    .yard .visitor{ width:30%; transform:translateX(-50%); cursor:pointer; filter:drop-shadow(0 8px 10px rgba(0,0,0,.12)); animation:pop .5s ease-out; }
    .yard .visitor.friend::after{ content:""; }
    @keyframes pop{ from{ opacity:0; transform:translateX(-50%) translateY(10px) scale(.9);} to{ opacity:1; transform:translateX(-50%);} }
    .bubble-tag{ position:absolute; transform:translate(-50%,-100%); background:#fff; border-radius:999px; padding:4px 10px; font-size:12px; color:#8a6a50; box-shadow:0 4px 10px rgba(0,0,0,.08); white-space:nowrap; pointer-events:none; }
    .bowl-tag{ position:absolute; left:50%; bottom:1.5%; transform:translateX(-50%); background:rgba(255,255,255,.92); border-radius:999px; padding:5px 12px; font-size:12px; color:#555; white-space:nowrap; }
    .status{ margin-top:12px; text-align:center; font-size:14px; color:#6f6a62; line-height:1.7; }
    .shop{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
    .shop .it{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:8px 4px; text-align:center; font-size:12px; color:#444; cursor:pointer; }
    .shop .it img{ width:70%; aspect-ratio:1/1; object-fit:contain; }
    .shop .it.own{ background:#f6f1e8; color:#9a9a9a; cursor:default; }
    .shop .it .c{ color:#8a6a50; margin-top:2px; }
    .yard .resident{ width:19%; transform:translateX(-50%); cursor:pointer; filter:drop-shadow(0 6px 8px rgba(0,0,0,.10)); }
    .home-tag{ position:absolute; transform:translate(-50%,-100%); background:rgba(255,255,255,.9); border-radius:999px; padding:2px 8px; font-size:11px; color:#8a6a50; white-space:nowrap; pointer-events:none; }
    .yard .gift{ left:70%; bottom:9%; width:11%; transform:translateX(-50%); cursor:pointer; filter:drop-shadow(0 4px 6px rgba(0,0,0,.15)); animation:pop .5s ease-out, bob 2.4s ease-in-out .5s infinite; }
    @keyframes bob{ 0%,100%{ transform:translateX(-50%);} 50%{ transform:translateX(-50%) translateY(-4px);} }
    .gift-tag{ position:absolute; left:70%; bottom:17%; transform:translateX(-50%); background:#fff; border-radius:999px; padding:3px 9px; font-size:11px; color:#8a6a50; pointer-events:none; white-space:nowrap; }
    .streak{ text-align:center; font-size:12px; color:#a09a90; margin-top:4px; }
    .scene{ width:100%; border-radius:18px; display:block; }
    .away-text{ text-align:center; font-size:17px; line-height:1.7; margin-top:14px; color:#333; }
    .giftgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
    .giftgrid .g{ background:#faf8f4; border:1px solid var(--line); border-radius:14px; padding:6px 4px 8px; text-align:center; font-size:11px; color:#555; }
    .giftgrid .g img{ width:70%; aspect-ratio:1/1; object-fit:contain; display:block; margin:0 auto; }
    .giftgrid .g.locked img{ filter:brightness(0) opacity(.12); }
    .giftgrid .g.locked{ color:#bbb; }
    .sub-h{ margin:22px 0 0; font-size:15px; letter-spacing:.08em; }
    .hearts{ text-align:center; color:var(--accent); font-size:18px; letter-spacing:.2em; margin-top:4px; }
    .lvnote{ text-align:center; font-size:12px; color:#8a8a8a; margin-top:2px; }
    .catname{ text-align:center; font-size:20px; font-weight:700; margin-top:4px; }
    .namebtn{ background:none; color:#8a6a50; padding:2px 6px; font-size:12px; text-decoration:underline; }
    .namerow{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
    .namerow input{ font-family:inherit; font-size:16px; padding:9px 14px; border-radius:999px; border:1px solid var(--line); width:min(220px,55vw); }
    .stories{ margin-top:18px; border-top:1px dashed var(--line); padding-top:14px; }
    .story{ font-size:15px; line-height:1.8; color:#444; margin-top:10px; padding-left:28px; position:relative; }
    .story::before{ content:attr(data-lv); position:absolute; left:0; top:1px; font-size:12px; color:var(--accent); }
    .story.locked{ color:#b0aaa0; }
    .levelup{ text-align:center; background:#fbf3ea; border-radius:16px; padding:10px; margin-top:10px; color:#8a6a50; font-size:14px; line-height:1.6; }
    /* Modal */
    .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:90; display:flex; align-items:flex-end; justify-content:center; }
    .modal{ background:#fff; width:min(620px,100%); max-height:92vh; overflow:auto; border-radius:28px 28px 0 0; padding:22px 20px 28px; }
    @media (min-width:700px){ .modal-bg{ align-items:center; } .modal{ border-radius:28px; } }
    .cue{ text-align:center; font-size:15px; color:#444; line-height:1.7; margin-top:8px; }
    .q{ text-align:center; font-size:13px; color:#8a8a8a; letter-spacing:.12em; margin-top:14px; }
    .opts{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .opt{ text-align:left; background:#faf8f4; color:#222; border:1px solid var(--line); border-radius:16px; padding:14px 16px; font-size:16px; line-height:1.5; }
    .opt:disabled{ opacity:1; cursor:default; }
    .opt.right{ background:#eef6ea; border-color:#a9cf9b; }
    .opt.wrong{ background:#fbeeee; border-color:#e4b1b1; }
    .verdict{ text-align:center; margin-top:16px; font-size:17px; font-weight:700; }
    .sync{ text-align:center; font-size:11px; color:#a09a90; margin-top:18px; letter-spacing:.08em; }
    .toast{ position:fixed; top:72px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,.92); color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; z-index:120; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
    .toast.show{ opacity:1; }

    @media (max-width:420px){
      .brand .sub{ display:none; }
      .card{ padding:18px; border-radius:22px; }
      .bubble{ font-size:18px; }
      .acct{ padding:7px 10px; }
    }
  </style>
</head>

  function readLocal(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(_){ return fb; } }
  function writeLocal(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
  const uniq = a => Array.from(new Set((a||[]).map(String)));

  const EMPTY = { fish:0, seen:[], favs:[], adopted:[], items:[], bowl:0, visits:[], names:{}, aff:{}, gifts:{}, gift:null, lastSeen:0, streak:0, streakDay:"", lastDaily:"", lastShare:"" };
  function cleanGifts(o){ const r={}; if (o && typeof o==="object") for (const [k,v] of Object.entries(o)){ const n=Math.max(0, Math.min(9999, Math.floor(Number(v)||0))); if (GIFTS[k] && n) r[k]=n; } return r; }
  function cleanGift(g){ return (g && GIFTS[g.g] && Number(g.cat)>=1 && Number(g.cat)<=23) ? { g:String(g.g), cat:String(g.cat) } : null; }
  function cleanName(n){ return String(n||"").replace(/[<>{}\[\]\\\/"`]/g,"").replace(/\s+/g," ").trim().slice(0, RULES.nameMax); }
  function cleanNames(o){ const r={}; if (o && typeof o==="object") for (const [k,v] of Object.entries(o)){ const id=Number(k); const n=cleanName(v); if (id>=1 && id<=23 && n) r[String(id)]=n; } return r; }
  function cleanAff(o){ const r={}; if (o && typeof o==="object") for (const [k,v] of Object.entries(o)){ const id=Number(k); const n=Math.max(0, Math.min(999, Math.floor(Number(v)||0))); if (id>=1 && id<=23 && n) r[String(id)]=n; } return r; }
  // 親密度：成為朋友 = ♡1；再來玩 lv2 次 = ♡2；總共 lv3 次 = ♡3（住下來）
  function levelOf(s, id){ id=String(id); if (!s.adopted.includes(id)) return 0; const a = s.aff[id]||0; return a>=RULES.lv3 ? 3 : a>=RULES.lv2 ? 2 : 1; }
  function toNext(s, id){ const a = s.aff[String(id)]||0, lv = levelOf(s,id); return lv===1 ? RULES.lv2-a : lv===2 ? RULES.lv3-a : 0; }
  function normalize(s){ s = s || {}; return { fish: Number(s.fish)||0, seen: uniq(s.seen), favs: uniq(s.favs), adopted: uniq(s.adopted), items: uniq(s.items), bowl: Math.max(0, Number(s.bowl)||0),
    visits: Array.isArray(s.visits) ? s.visits.filter(v=>v && v.cat && v.at).map(v=>({ id:String(v.id||v.at), cat:String(v.cat), at:Number(v.at) })) : [],
    names: cleanNames(s.names), aff: cleanAff(s.aff), gifts: cleanGifts(s.gifts), gift: cleanGift(s.gift),
    lastSeen: Number(s.lastSeen)||0, streak: Math.max(0, Math.floor(Number(s.streak)||0)), streakDay: String(s.streakDay||""),
    lastDaily: s.lastDaily||"", lastShare: s.lastShare||"" }; }
  function merge(a, b){ a=normalize(a); b=normalize(b); return { fish: Math.max(a.fish,b.fish), seen: uniq([...a.seen,...b.seen]), favs: uniq([...a.favs,...b.favs]), adopted: uniq([...a.adopted,...b.adopted]), items: uniq([...a.items,...b.items]), bowl: Math.max(a.bowl,b.bowl), visits: a.visits.length>=b.visits.length ? a.visits : b.visits,
    gifts: Object.fromEntries(uniq([...Object.keys(a.gifts),...Object.keys(b.gifts)]).map(k=>[k, Math.max(a.gifts[k]||0, b.gifts[k]||0)])),
    gift: a.gift || b.gift, lastSeen: Math.max(a.lastSeen,b.lastSeen),
    ...(a.streakDay>=b.streakDay ? { streak:a.streak, streakDay:a.streakDay } : { streak:b.streak, streakDay:b.streakDay }),
    names: { ...b.names, ...a.names }, aff: Object.fromEntries(uniq([...Object.keys(a.aff),...Object.keys(b.aff)]).map(k=>[k, Math.max(a.aff[k]||0, b.aff[k]||0)])), lastDaily: a.lastDaily>b.lastDaily?a.lastDaily:b.lastDaily, lastShare: a.lastShare>b.lastShare?a.lastShare:b.lastShare }; }

  function Icon(name){
    const p = { viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:1.6, strokeLinecap:"round", strokeLinejoin:"round" };
    if (name==="fish") return e("svg",p, e("path",{d:"M2 12c0 2 2 3.5 4 4.5 1.5.75 5 1.5 9 .5 2.5-.6 6-2 6-5s-3.5-4.4-6-5c-4-1-7.5-.25-9 .5-2 1-4 2.5-4 4.5z"}), e("path",{d:"M19 12c0 1.5 2 3 3 3v-6c-1 0-3 1.5-3 3z"}), e("circle",{cx:6.5,cy:12,r:.8,fill:"currentColor"}));
    if (name==="heart") return e("svg",p, e("path",{d:"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"}));
    if (name==="heartFill") return e("svg",{...p, fill:"currentColor", stroke:"none"}, e("path",{d:"M12 21s-7-4.6-9.3-8.6C.7 8.9 3 5.5 6.8 5.1c1.8-.2 3.6.6 5.2 2.2 1.6-1.6 3.4-2.4 5.2-2.2 3.8.4 6.1 3.8 4.1 7.3C19 16.4 12 21 12 21z"}));
    if (name==="image") return e("svg",p, e("rect",{x:3,y:3,width:18,height:18,rx:3}), e("circle",{cx:9,cy:9,r:2}), e("path",{d:"M21 15l-5-5L5 21"}));
    if (name==="next") return e("svg",p, e("path",{d:"M5 12h14"}), e("path",{d:"M13 6l6 6-6 6"}));
    if (name==="paw") return e("svg",{...p, fill:"currentColor", stroke:"none"}, e("circle",{cx:7,cy:9,r:2}), e("circle",{cx:12,cy:6.5,r:2}), e("circle",{cx:17,cy:9,r:2}), e("path",{d:"M12 11c3 0 5 3 5 5.2 0 1.6-1.3 2.3-2.6 2.3-1 0-1.6-.6-2.4-.6s-1.4.6-2.4.6C8.3 18.5 7 17.8 7 16.2 7 14 9 11 12 11z"}));
    if (name==="logo") return e("svg",{viewBox:"0 0 100 90", fill:"none", stroke:"currentColor", strokeWidth:4, strokeLinecap:"round", strokeLinejoin:"round"},
      e("path",{d:"M20 90 Q 10 50, 30 35 Q 40 25, 60 25 Q 80 25, 90 50 Q 100 90, 80 90 Z"}), e("path",{d:"M25 40 L 20 15 L 45 30"}), e("path",{d:"M75 40 L 80 15 L 55 30"}),
      e("circle",{cx:40,cy:55,r:3}), e("circle",{cx:80,cy:55,r:3}), e("path",{d:"M55 60 L 60 65 L 65 60"}));
    return null;
  }

  // ---- 分享圖卡（1080×1350）----
  function loadImg(src){ return new Promise((ok, bad)=>{ const i = new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src=src; }); }
  function wrapCJK(ctx, text, maxW){
    const tokens = text.match(/[A-Za-z0-9'’.,:()&\-–]+\s*|\s+|./gu) || [];
    const lines = []; let line = "";
    for (const t of tokens){ const n = line + t; if (ctx.measureText(n).width > maxW && line){ lines.push(line.trimEnd()); line = t.trimStart(); } else line = n; }
    if (line) lines.push(line); return lines;
  }
  async function makeCard(fact){
    const W=1080, H=1350, c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
    try{ await document.fonts.load('700 60px "Noto Sans TC"'); await document.fonts.load('400 40px "Noto Sans TC"'); }catch(_){}
    const F='"Noto Sans TC", sans-serif';
    x.fillStyle="#F2F0EB"; x.fillRect(0,0,W,H);
    x.fillStyle="#FFFFFF"; x.beginPath(); x.roundRect(60,60,W-120,H-120,56); x.fill();
    x.fillStyle="#8a8a8a"; x.font=`500 30px ${F}`; x.textAlign="center"; x.fillText("今 日 貓 語 翻 譯", W/2, 140);
    try{ const img = await loadImg(catSrc(fact.id)); x.drawImage(img, W/2-200, 160, 400, 400); }catch(_){}
    x.fillStyle="#C9895B"; x.font=`700 40px ${F}`; x.fillText(fact.behavior, W/2, 610);
    x.font=`700 50px ${F}`;
    const says = wrapCJK(x, fact.catSays, W-300); const bh = 64 + says.length*74;
    x.fillStyle="#FFFDF7"; x.strokeStyle="#ece3cf"; x.lineWidth=3; x.beginPath(); x.roundRect(120,645,W-240,bh,40); x.fill(); x.stroke();
    x.fillStyle="#222"; says.forEach((l,i)=>x.fillText(l, W/2, 645+74+i*74));
    let y = 645 + bh + 80;
    x.textAlign="left"; x.fillStyle="#8a8a8a"; x.font=`500 28px ${F}`; x.fillText("真 相", 140, y);
    x.fillStyle="#444"; x.font=`400 34px ${F}`;
    wrapCJK(x, fact.explain, W-280).slice(0,5).forEach((l,i)=>x.fillText(l, 140, y+56+i*54));
    x.textAlign="center"; x.fillStyle="#9a9a9a"; x.font=`400 24px ${F}`;
    const src = fact.sourceName ? wrapCJK(x, "資料來源：" + fact.sourceName, W-280).slice(0,2) : [];
    src.forEach((l,i)=>x.fillText(l, W/2, H-160 - (src.length-1-i)*34));
    x.fillStyle="#555"; x.font=`700 30px ${F}`; x.fillText("喵～時刻 Meow~ Moment", W/2, H-112);
    return new Promise(ok=>c.toBlob(ok,"image/png"));
  }

  // 依「放小魚的時間」安排來訪：每條小魚 = 一隻貓，在 10–30 分鐘內陸續抵達
  function pickCat(st, exclude){
    const pool = [];
    for (let id=1; id<=23; id++){
      const k = String(id);
      if (exclude.includes(k)) continue;
      if (isSpecial(k) && !st.adopted.includes(k)) continue;    // 特別貓要先靠連續登入認識
      const need = NEEDS[k];
      if (need && !st.items.includes(need)) continue;           // 沒有對應道具，這隻不會來
      const w = st.adopted.includes(k) ? 1 : (need ? 6 : 3);     // 還不認識的貓比較常來；道具貓更容易被吸引
      for (let i=0;i<w;i++) pool.push(k);
    }
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function shuffleSeeded(arr, seed){
    let s = 0; for (const ch of String(seed)) s = (s*31 + ch.charCodeAt(0)) >>> 0;
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){ s = (s*1103515245 + 12345) >>> 0; const j = s % (i+1); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function minsText(ms){ const m = Math.max(1, Math.round(ms/60000)); return `${m} 分鐘`; }

  function App(){
    const [facts, setFacts] = useState(null);
    const [loadErr, setLoadErr] = useState(false);
    const [user, setUser] = useState(null);
    const [st, setSt] = useState(null);
    const [sync, setSync] = useState("連線中…");
    const [view, setView] = useState("yard");
    const [now, setNow] = useState(Date.now());
    const [quiz, setQuiz] = useState(null);      // { visit, picked }
    const [detail, setDetail] = useState(null);  // 圖鑑點開的貓
    const [toast, setToast] = useState("");
    const [busy, setBusy] = useState(false);
    const saveTimer = useRef(null);
    const stRef = useRef(null);

    function say(m){ setToast(m); clearTimeout(window.__toastT); window.__toastT = setTimeout(()=>setToast(""), 2600); }
    const factOf = id => facts && facts.find(f=>String(f.id)===String(id));
    const nameOf = id => (st && st.names[String(id)]) || CAT_COATS[id];
    const nameOf2 = (s, id) => s.names[String(id)] || CAT_COATS[id];
    const [popups, setPopups] = useState([]);
    function collectGift(){
      if (!st || !st.gift) return; const { cat, g } = st.gift;
      update(s=>({ ...s, gift:null, fish:s.fish+RULES.giftFish, gifts:{ ...s.gifts, [g]:(s.gifts[g]||0)+1 } }));
      say(`${nameOf(cat)}留給你一個${GIFTS[g].name} +${RULES.giftFish} 🐟`);
    }
    const [naming, setNaming] = useState(null);   // 正在取名的貓 id
    const [nameDraft, setNameDraft] = useState("");
    function saveName(id){
      const n = cleanName(nameDraft); id = String(id);
      update(s=>{ const names = { ...s.names }; if (n) names[id]=n; else delete names[id]; return { ...s, names }; });
      setNaming(null); say(n ? `以後就叫牠「${n}」了` : "已改回原本的稱呼");
    }

    useEffect(()=>{ const t = setInterval(()=>setNow(Date.now()), 15000); return ()=>clearInterval(t); }, []);
    useEffect(()=>{ const f = ()=>setNow(Date.now()); document.addEventListener("visibilitychange", f); return ()=>document.removeEventListener("visibilitychange", f); }, []);

    useEffect(()=>{
      fetch("./facts.json?v=" + twDate(), { cache:"no-store" })
        .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(list=> setFacts(list.filter(f=>f && f.catSays && f.explain)))
        .catch(()=> setLoadErr(true));
    }, []);

    useEffect(()=>{
      const off = onAuthStateChanged(auth, async u=>{
        if (!u){ try{ await signInAnonymously(auth); }catch(err){ setSync("無法連線，進度暫存在這台裝置"); setSt(normalize(readLocal("meow_state", EMPTY))); } return; }
        setUser(u);
        try{
          const snap = await getDoc(doc(db, "users", u.uid));
          let s = snap.exists() ? normalize(snap.data()) : EMPTY;
          const legacy = { fish: readLocal("meow_fish", 0), seen: readLocal("meow_seen_facts", []), favs: (readLocal("meow_fav_facts", [])||[]).map(f=>f.id), adopted: [] };
          s = merge(s, merge(readLocal("meow_state", EMPTY), legacy));
          // 縮短等待時間後，把之前排得比較晚的貓提前到新的時間範圍內
          s = { ...s, visits: s.visits.map(v=> v.at > Date.now() ? { ...v, at: Date.now() } : v) };
          stRef.current = s; setSt(s); setSync("已存到雲端 ✓");
          await persist(u, s);
        }catch(err){ console.error(err); setSync("雲端讀取失敗，先用這台裝置的進度"); setSt(normalize(readLocal("meow_state", EMPTY))); }
      });
      return off;
    }, []);

    async function persist(u, s){
      writeLocal("meow_state", s);
      if (!u) return;
      try{ await setDoc(doc(db, "users", u.uid), { ...s, updatedAt: serverTimestamp() }); setSync("已存到雲端 ✓"); }
      catch(err){ console.error(err); setSync("⚠ 雲端存檔失敗，已先存在這台裝置"); }
    }
    function update(fn){
      setSt(prev=>{
        const next = { ...normalize(fn(prev)), lastSeen: Date.now() };
        stRef.current = next; writeLocal("meow_state", next); setSync("存檔中…");
        clearTimeout(saveTimer.current); saveTimer.current = setTimeout(()=>persist(auth.currentUser, stRef.current), 600);
        return next;
      });
    }

    // 一打開 App：每日小魚、連續來訪、特別貓、回禮、「你不在的時候」
    useEffect(()=>{
      if (!st || !facts) return;
      const today = twDate(), t = Date.now(), away = st.lastSeen ? t - st.lastSeen : 0;
      const pops = [];
      let s = { ...st };
      if (s.lastDaily !== today){ s.fish += RULES.dailyBonus; s.lastDaily = today; say(`今天第一次來，送你 ${RULES.dailyBonus} 條小魚 🐟`); }
      if (s.streakDay !== today){
        s.streak = s.streakDay === twDate(-1) ? s.streak + 1 : 1; s.streakDay = today;
        const got = SPECIALS.filter(x=> s.streak >= x.days && !s.adopted.includes(x.id));
        if (got.length){ s.adopted = uniq([...s.adopted, ...got.map(x=>x.id)]); s.seen = uniq([...s.seen, ...got.map(x=>x.id)]); got.forEach(x=>pops.push({ type:"special", id:x.id, days:x.days })); }
      }
      const friends = s.adopted.filter(id=>!s.visits.some(v=>v.cat===id));
      if (away >= RULES.giftMs && !s.gift && Math.random() < RULES.giftChance){
        const close = s.adopted.filter(id=>levelOf(s,id)>=2);
        if (close.length){ const cat = close[Math.floor(Math.random()*close.length)]; const keys = Object.keys(GIFTS);
          const g = CAT_GIFT[cat] && Math.random()<0.5 ? CAT_GIFT[cat] : keys[Math.floor(Math.random()*keys.length)]; s.gift = { cat, g }; }
      }
      if (away >= RULES.awayMs && friends.length){
        const scenes = SCENES.filter(x=>!x.need || s.items.includes(x.need)); const sc = scenes[Math.floor(Math.random()*scenes.length)];
        const pick = friends.slice().sort(()=>Math.random()-.5); const A = nameOf2(s, pick[0]); const B = pick[1] ? nameOf2(s, pick[1]) : "隔壁的貓";
        const line = sc.lines[Math.floor(Math.random()*sc.lines.length)].replaceAll("{A}", A).replaceAll("{B}", B);
        pops.push({ type:"away", img:sc.img, text:line, gift: !!s.gift && !st.gift });
      }
      update(()=>s); if (pops.length) setPopups(pops);
    }, [!!st && !!facts]);

    // ---- 院子 ----
    const arrived = st ? st.visits.filter(v=>v.at<=now).slice(0, RULES.maxVisitors) : [];
    const pending = st ? st.visits.filter(v=>v.at>now) : [];
    // 住下來的貓（♡♡♡）：每天輪流顯示幾隻，正在當訪客的那隻不重複出現
    const residents = st ? (()=>{ const all = st.adopted.filter(id=>levelOf(st,id)===3 && !st.visits.some(v=>v.cat===id)).sort((a,b)=>a-b);
      if (all.length <= RULES.maxResidents) return all; const k = dayNumber() % all.length; return [...all.slice(k), ...all.slice(0,k)].slice(0, RULES.maxResidents); })() : [];

    function feed(){
      if (!st) return;
      if (st.fish < RULES.feedCost){ say("小魚不夠了，明天再來領吧"); return; }
      if (pending.length + arrived.length >= RULES.maxVisitors){ say(`院子裡已經有 ${RULES.maxVisitors} 隻貓了，先跟牠們玩吧`); return; }
      update(s=>{
        const taken = s.visits.map(v=>v.cat);
        const cat = pickCat(s, taken) || pickCat(s, []);
        const at = Date.now() + RULES.arriveMs;
        return { ...s, fish:s.fish-RULES.feedCost, visits:[...s.visits, { id:String(Date.now()), cat, at }] };
      });
      say("放好了！有貓聞到味道了… 🐾"); setTimeout(()=>setNow(Date.now()), RULES.arriveMs + 50);
    }
    function buy(key){
      const it = ITEMS[key]; if (!st || st.items.includes(key)) return;
      if (st.fish < it.cost){ say(`還差 ${it.cost - st.fish} 條小魚`); return; }
      update(s=>({ ...s, fish:s.fish-it.cost, items:[...s.items, key] }));
      say(`${it.name}放好了，說不定會吸引特別的貓喔`);
    }
    function openVisitor(v){
      const f = factOf(v.cat); if (!f) return;
      if (st.adopted.includes(v.cat)){
        // 老朋友：直接打招呼
        const before = levelOf(st, v.cat);
        const after = levelOf({ ...st, aff:{ ...st.aff, [v.cat]:(st.aff[v.cat]||0)+1 } }, v.cat);
        update(s=>({ ...s, fish:s.fish+RULES.friendVisit, visits:s.visits.filter(x=>x.id!==v.id), aff:{ ...s.aff, [v.cat]:(s.aff[v.cat]||0)+1 } }));
        setDetail({ id:v.cat, greet:true, levelUp: after>before ? after : 0 });
        return;
      }
      setQuiz({ visit:v, picked:null, options: shuffleSeeded([f.catSays, ...(f.wrong||[])], v.id) });
    }
    function answer(opt){
      if (!quiz || quiz.picked) return;
      const f = factOf(quiz.visit.cat); const ok = opt === f.catSays; const id = quiz.visit.cat;
      setQuiz({ ...quiz, picked:opt, ok });
      update(s=>({ ...s,
        visits: s.visits.filter(x=>x.id!==quiz.visit.id),
        seen: uniq([...s.seen, id]),
        adopted: ok ? uniq([...s.adopted, id]) : s.adopted,
        fish: s.fish + (ok ? RULES.correct : 0) }));
    }

    async function linkGoogle(){
      const provider = new GoogleAuthProvider();
      try{ await linkWithPopup(auth.currentUser, provider); setUser({ ...auth.currentUser }); say("已用 Google 綁定，換手機也找得回進度"); }
      catch(err){
        if (err.code === "auth/credential-already-in-use"){
          const cred = GoogleAuthProvider.credentialFromError(err); const local = stRef.current || st;
          const res = await signInWithCredential(auth, cred); const snap = await getDoc(doc(db, "users", res.user.uid));
          const merged = merge(snap.exists() ? snap.data() : EMPTY, local);
          setUser(res.user); setSt(merged); stRef.current = merged; await persist(res.user, merged); say("已切換到你的 Google 帳號，進度已合併");
        } else if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request"){ console.error(err); say("綁定失敗：" + (err.code || "請再試一次")); }
      }
    }
    function toggleFav(id){ id = String(id); update(s=> s.favs.includes(id) ? { ...s, favs:s.favs.filter(x=>x!==id) } : { ...s, favs:[id, ...s.favs] }); }
    async function shareCard(id){
      const fact = factOf(id); if (!fact || busy) return; setBusy(true);
      try{
        const blob = await makeCard(fact);
        const file = new File([blob], `meow-${String(fact.id).padStart(2,"0")}.png`, { type:"image/png" });
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        if (isMobile && navigator.canShare && navigator.canShare({ files:[file] })){
          await navigator.share({ files:[file], title:"今日貓語翻譯", text: fact.catSays + "\n— 喵～時刻 " + location.href.split("?")[0] });
        } else {
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(a.href), 2000); say("圖卡已下載到「下載」資料夾");
        }
        if (st && st.lastShare !== twDate()){ update(s=>({ ...s, fish:s.fish+RULES.shareBonus, lastShare:twDate() })); say(`分享圖卡，獲得 ${RULES.shareBonus} 條小魚 🐟（每天一次）`); }
      }catch(err){ if (err && err.name !== "AbortError") say("圖卡產生失敗，請再試一次"); }
      setBusy(false);
    }

    // ---- 畫面 ----
    const isAnon = !user || user.isAnonymous;
    const header = e("div",{className:"header"},
      e("div",{className:"header-inner"},
        e("div",{className:"brand"}, Icon("logo"), e("div",null, e("div",{className:"title"},"喵～時刻"), e("div",{className:"sub"},"讀懂貓咪的真心話"))),
        e("div",{className:"h-actions"},
          e("div",{className:"badge", title:"小魚"}, Icon("fish"), e("b",null, st ? String(st.fish) : "–")),
          isAnon ? e("button",{className:"acct", onClick:linkGoogle, title:"綁定後換手機也找得回進度"}, "用 Google 保存進度")
                 : e("span",{className:"acct done"}, "✓ 已綁定"))));
    const tabs = e("div",{className:"tabs"},
      [["yard","院子"],["dex",`貓咪圖鑑 ${st?st.adopted.filter(id=>!isSpecial(id)).length:0}/20`],["favs","收藏"]].map(([k,l])=>
        e("div",{key:k, className:"tab"+(view===k?" on":""), onClick:()=>setView(k)}, l)));

    function FactBlock(f){
      return e(React.Fragment,null,
        e("div",{className:"behavior"}, f.behavior),
        e("div",{className:"bubble"}, f.catSays),
        e("div",{className:"truth-label"},"真相"),
        e("div",{className:"truth"}, f.explain),
        f.sourceName ? e("div",{className:"source"}, "資料來源：", f.sourceUrl ? e("a",{href:f.sourceUrl, target:"_blank", rel:"noopener"}, f.sourceName) : f.sourceName) : null);
    }

    let body;
    if (loadErr) body = e("div",{className:"card"}, e("p",null,"貓語載入失敗，請重新整理再試一次。"));
    else if (!facts || !st) body = e("div",{className:"card"}, e("p",{style:{color:"#888"}},"貓咪準備中…"));
    else if (view==="yard"){
      let status;
      if (arrived.length) status = `有 ${arrived.length} 隻貓來了！點牠，猜猜牠在說什麼`;
      else if (st.gift) status = "有貓留了回禮給你，點一下收下";
      else if (residents.length && !pending.length) status = "點食盆放 1 條小魚，會有貓來。住下來的貓也可以點點看";
      else if (pending.length) status = "有貓聞到味道了，正在走過來…";
      else status = "點食盆放 1 條小魚，馬上會有貓來";
      body = e("div",null,
        e("div",{className:"yard"},
          Object.entries(ITEMS).filter(([k])=>st.items.includes(k)).map(([k,it])=> e("img",{key:k, className:"item", src:`./yard/${k}.webp`, alt:it.name, style:it.pos})),
          residents.map((id,i)=> e(React.Fragment,{key:"home"+id},
            e("img",{className:"resident", src:catSrc(id), alt:nameOf(id), style:HOME_SLOTS[i], onClick:()=>setDetail({id})}),
            e("div",{className:"home-tag", style:{ left:HOME_SLOTS[i].left, bottom:`calc(${HOME_SLOTS[i].bottom} + 17%)` }}, nameOf(id)))),
          e("img",{className:"bowl", src:"./yard/bowl.webp", alt:"食盆，點一下放小魚", onClick:feed}),
          st.gift ? e(React.Fragment,null,
            e("img",{className:"gift", src:`./gifts/${st.gift.g}.webp`, alt:"回禮", onClick:collectGift}),
            e("div",{className:"gift-tag"}, "回禮 🎁")) : null,
          e("div",{className:"bowl-tag"}, pending.length ? `🐟 × ${pending.length}` : "點我放小魚"),
          arrived.map((v,i)=>{
            const friend = st.adopted.includes(v.cat);
            return e(React.Fragment,{key:v.id},
              e("img",{className:"visitor", src:catSrc(v.cat), alt:"來訪的貓", style:SLOTS[i], onClick:()=>openVisitor(v)}),
              e("div",{className:"bubble-tag", style:{ left:SLOTS[i].left, bottom:`calc(${SLOTS[i].bottom} + 26%)` }}, friend ? `${nameOf(v.cat)} ${"♡".repeat(levelOf(st,v.cat))}` : "？"));
          })),
        e("div",{className:"status"}, status),
        e("div",{className:"streak"}, (()=>{ const nx = SPECIALS.find(x=>!st.adopted.includes(x.id));
          return `連續來訪 ${st.streak} 天` + (nx ? `　·　第 ${nx.days} 天會有特別的貓來` : "　·　特別的貓都來過了 ✓"); })()),
        e("div",{className:"card"},
          e("div",{className:"dex-head"}, e("h2",null,"道具"), e("span",null,"放在院子裡，會吸引特別的貓")),
          e("div",{className:"shop"},
            Object.entries(ITEMS).map(([k,it])=>{
              const own = st.items.includes(k);
              return e("div",{key:k, className:"it"+(own?" own":""), onClick:()=>buy(k)},
                e("img",{src:`./yard/${k}.webp`, alt:it.name}), e("div",null,it.name), e("div",{className:"c"}, own ? "已擺放" : `🐟 ${it.cost}`));
            })),
          e("div",{className:"rules"}, `每天第一次來 +${RULES.dailyBonus}　猜對 +${RULES.correct}　老朋友來玩 +${RULES.friendVisit}　分享圖卡 +${RULES.shareBonus}（每天一次）　餵食 −${RULES.feedCost}`)));
    } else if (view==="dex"){
      const n = st.adopted.filter(id=>!isSpecial(id)).length;
      body = e("div",{className:"card"},
        e("div",{className:"dex-head"}, e("h2",null,"貓咪圖鑑"), e("span",null, `交到 ${n} / 20 個朋友`)),
        e("div",{className:"progress"}, e("i",{style:{width:`${n/20*100}%`}})),
        e("div",{className:"rules"}, `在院子猜對貓語，就能跟牠交朋友（♡）。朋友再來玩 ${RULES.lv2} 次變 ♡♡，再 ${RULES.lv3-RULES.lv2} 次變 ♡♡♡，牠就會住下來。每升一級解鎖一段牠的故事。`),
        e("div",{className:"grid"},
          facts.filter(f=>!f.special).sort((a,b)=>a.id-b.id).map(f=>{
            const id = String(f.id); const has = st.adopted.includes(id); const need = NEEDS[id];
            return e("div",{key:id, className:"cell"+(has?"":" locked"), onClick:()=> has ? setDetail({id}) : say(need && !st.items.includes(need) ? `這隻貓喜歡${ITEMS[need].name}，擺好牠才會來` : "還沒交到這個朋友，多放點小魚吧")},
              e("img",{src:catSrc(id), alt: has ? `${CAT_COATS[id]}，${f.behavior}` : "尚未相遇", loading:"lazy"}),
              e("div",{className:"n"}, `No.${String(id).padStart(2,"0")}`),
              e("div",{className:"t"}, has ? `${nameOf(id)} ${"♡".repeat(levelOf(st,id))}` : (need && !st.items.includes(need) ? `需要${ITEMS[need].name}` : "？？？")));
          })),
        e("h3",{className:"sub-h"}, "特別的貓"),
        e("div",{className:"rules"}, "連續來院子，就會有特別的貓來找你。中斷一天會重新從第 1 天算，已經來過的特別貓都會留著。"),
        e("div",{className:"grid"},
          SPECIALS.map(x=>{ const has = st.adopted.includes(x.id);
            return e("div",{key:x.id, className:"cell"+(has?"":" locked"), onClick:()=> has ? setDetail({id:x.id}) : say(`連續來 ${x.days} 天，牠就會出現`)},
              e("img",{src:catSrc(x.id), alt: has ? CAT_COATS[x.id] : "尚未相遇", loading:"lazy"}),
              e("div",{className:"n"}, `連續 ${x.days} 天`),
              e("div",{className:"t"}, has ? `${nameOf(x.id)} ${"♡".repeat(levelOf(st,x.id))}` : "？？？")); })));
    } else {
      const list = st.favs.map(id=>factOf(id)).filter(Boolean);
      const gotN = Object.keys(st.gifts).length;
      body = e("div",null, e("div",{className:"card"},
        e("div",{className:"dex-head"}, e("h2",null,"回禮盒"), e("span",null, `${gotN} / 12 種`)),
        e("div",{className:"rules"}, "親密度 ♡♡ 以上的貓，在你離開一陣子後，有時會在院子留下小禮物。"),
        e("div",{className:"giftgrid"}, Object.entries(GIFTS).map(([k,g])=>{ const c = st.gifts[k]||0;
          return e("div",{key:k, className:"g"+(c?"":" locked")}, e("img",{src:`./gifts/${k}.webp`, alt:c?g.name:"還沒收到", loading:"lazy"}), c ? `${g.name} ×${c}` : "？？？"); }))),
        e("div",{className:"card"},
        e("div",{className:"dex-head"}, e("h2",null,"我的收藏"), e("span",null, `${list.length} 則`)),
        list.length===0 ? e("p",{style:{color:"#888", fontSize:"14px"}},"在圖鑑裡點開喜歡的貓，按「收藏」就會出現在這裡。")
          : list.map(f=> e("div",{key:f.id, className:"fav", onClick:()=>setDetail({id:String(f.id)})},
              e("img",{src:catSrc(f.id), alt:""}), e("div",null, e("div",{className:"b"}, f.behavior), e("div",{className:"s"}, f.catSays))))));
    }

    // 猜貓語
    let quizModal = null;
    if (quiz){
      const f = factOf(quiz.visit.cat);
      quizModal = e("div",{className:"modal-bg", onClick:()=> quiz.picked && setQuiz(null)},
        e("div",{className:"modal", onClick:ev=>ev.stopPropagation()},
          e("img",{className:"catpic", src:catSrc(f.id), alt:"來訪的貓"}),
          e("div",{className:"cue"}, f.cue),
          e("div",{className:"q"}, "牠在說什麼？"),
          e("div",{className:"opts"},
            quiz.options.map(o=> e("button",{key:o, className:"opt" + (quiz.picked ? (o===f.catSays?" right": (o===quiz.picked?" wrong":"")) : ""), onClick:()=>answer(o), disabled:!!quiz.picked}, o))),
          quiz.picked ? e(React.Fragment,null,
            e("div",{className:"verdict", style:{color: quiz.ok ? "#4f8a3d" : "#b5655f"}},
              quiz.ok ? `答對了！${CAT_COATS[f.id]}跟你成為朋友 ♡ +${RULES.correct} 🐟` : "差一點！牠先回家了，下次還會再來"),
            quiz.ok && f.stories ? e("div",{className:"levelup"}, "解鎖第 1 段故事：", e("br"), f.stories[0]) : null,
            FactBlock(f),
            e("div",{className:"actions"}, quiz.ok ? e("button",{className:"adopt", onClick:()=>{ setQuiz(null); setDetail({id:String(f.id)}); setNaming(String(f.id)); setNameDraft(""); }}, "幫牠取名字") : null,
            e("button",{onClick:()=>setQuiz(null)}, quiz.ok ? "收進圖鑑" : "好，下次再猜"))) : null));
    }
    // 圖鑑／老朋友詳細
    let detailModal = null;
    if (detail){
      const f = factOf(detail.id); const isFav = st.favs.includes(String(detail.id)); const lv = levelOf(st, f.id);
      const closeDetail = ()=>{ setDetail(null); setNaming(null); };
      detailModal = e("div",{className:"modal-bg", onClick:closeDetail},
        e("div",{className:"modal", onClick:ev=>ev.stopPropagation()},
          detail.greet ? e("div",{className:"verdict", style:{color:"#8a6a50"}}, `${nameOf(f.id)}來找你玩了 +${RULES.friendVisit} 🐟`) : null,
          detail.levelUp ? e("div",{className:"levelup"}, detail.levelUp===3 ? `親密度 ♡♡♡！${nameOf(f.id)}決定住下來了 🏡` : `親密度升到 ${"♡".repeat(detail.levelUp)}，解鎖新故事`) : null,
          e("img",{className:"catpic", src:catSrc(f.id), alt:`${nameOf(f.id)}，${f.behavior}`}),
          e("div",{className:"catname"}, nameOf(f.id), " ", (naming===String(f.id) || lv===0) ? null : e("button",{className:"namebtn", onClick:()=>{ setNaming(String(f.id)); setNameDraft(st.names[String(f.id)]||""); }}, st.names[String(f.id)] ? "改名" : "取名字")),
          naming===String(f.id) ? e("div",{className:"namerow"},
            e("input",{value:nameDraft, maxLength:RULES.nameMax, placeholder:`幫${CAT_COATS[f.id]}取個名字`, autoFocus:true, onChange:ev=>setNameDraft(ev.target.value), onKeyDown:ev=>{ if (ev.key==="Enter") saveName(f.id); }}),
            e("button",{onClick:()=>saveName(f.id)}, "好")) : null,
          e("div",{className:"hearts"}, hearts(lv)),
          e("div",{className:"lvnote"}, lv===0 ? "還不是朋友" : lv===3 ? "住在你的院子裡" : `再來玩 ${toNext(st,f.id)} 次升級`),
          FactBlock(f),
          f.stories ? e("div",{className:"stories"},
            e("div",{className:"truth-label"}, "牠的故事"),
            f.stories.map((t,i)=> e("div",{key:i, className:"story"+(lv>i?"":" locked"), "data-lv":"♡".repeat(i+1)},
              lv>i ? t : lv===0 ? "在院子猜對牠的貓語，就能解鎖" : `再來玩 ${(i===1?RULES.lv2:RULES.lv3) - (st.aff[String(f.id)]||0)} 次解鎖`))) : null,
          e("div",{className:"actions"},
            e("button",{className:"secondary", onClick:()=>toggleFav(f.id)}, Icon(isFav?"heartFill":"heart"), isFav?"已收藏":"收藏"),
            e("button",{className:"secondary", onClick:()=>shareCard(f.id), disabled:busy}, Icon("image"), busy?"產生中…":"存成圖卡"),
            e("button",{onClick:closeDetail}, "關閉"))));
    }

    let popModal = null;
    if (popups.length && !quiz && !detail){
      const pp = popups[0]; const next = ()=>setPopups(popups.slice(1));
      if (pp.type==="special"){
        const f = factOf(pp.id);
        popModal = e("div",{className:"modal-bg", onClick:next}, e("div",{className:"modal", onClick:ev=>ev.stopPropagation()},
          e("div",{className:"verdict", style:{color:"#8a6a50"}}, `連續來訪 ${pp.days} 天！`),
          e("img",{className:"catpic", src:catSrc(pp.id), alt:CAT_COATS[pp.id]}),
          e("div",{className:"catname"}, `${CAT_COATS[pp.id]}來找你了`),
          e("div",{className:"bubble"}, f.catSays),
          e("div",{className:"levelup"}, "牠直接成為你的朋友 ♡", e("br"), f.stories[0]),
          e("div",{className:"actions"},
            e("button",{className:"adopt", onClick:()=>{ next(); setDetail({id:pp.id}); setNaming(pp.id); setNameDraft(""); }}, "幫牠取名字"),
            e("button",{onClick:next}, "好"))));
      } else {
        popModal = e("div",{className:"modal-bg", onClick:next}, e("div",{className:"modal", onClick:ev=>ev.stopPropagation()},
          e("div",{className:"q", style:{marginTop:0, marginBottom:10}}, "你不在的時候"),
          e("img",{className:"scene", src:`./scenes/${pp.img}.webp`, alt:"院子裡發生的事"}),
          e("div",{className:"away-text"}, pp.text),
          pp.gift ? e("div",{className:"levelup"}, "還有貓留了回禮給你，去院子看看 🎁") : null,
          e("div",{className:"actions"}, e("button",{onClick:next}, "回院子"))));
      }
    }
    return e("div",null, header,
      e("div",{className:"wrap"}, tabs, body,
        e("div",{className:"sync"}, sync, isAnon ? "　·　目前未綁定帳號，換手機前請先用 Google 保存" : "")),
      quizModal, detailModal, popModal,
      e("div",{className:"toast"+(toast?" show":"")}, toast));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
